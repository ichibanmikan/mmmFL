
[Host]
server_address=10.102.0.230
port=12345

[Clients]
max_clients=200
min_clients=1
max_participant_clients=90
max_round_time=150
max_participant_time=300000

[Server]
timeout=60
band_width=15
context_file = ./context.pkl

[RL]
max_episode_length=3000
episode_round=1
min_size_high=180
batch_size_high=120
save_data_freq=20

[RL_high_agent]
hidden_dim=256
actor_lr=1e-3
critic_lr=1e-3
alpha_lr=1e-3
device=cuda
tau=0.005
target_entropy=-1
gamma=0.99

[PSO_low_agent]
swarm_size=32
max_iterations=60
inertia_weight=0.8
cognitive_coeff=1.5
social_coeff=1.5
min_bandwidth=0.001
fitness_lambda_time=1.0
fitness_lambda_energy=0.5
fitness_lambda_fairness=0.2
random_seed=42
device=cpu
